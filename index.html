    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg,#020617,#0f172a,#1e1b4b); min-height: 100vh; }
        .gbtn { background: linear-gradient(135deg,#06b6d4,#2563eb) !important; border: none !important; cursor: pointer !important; color: white !important; transition: all 0.2s; }
        .gbtn:hover { opacity: 0.9; transform: translateY(-1px); }
        .inp { background: rgba(51,65,85,0.8); border: 1px solid rgba(71,85,105,0.6); color: white; padding: 0.85rem 1rem; border-radius: 0.75rem; width: 100%; font-size: 16px; font-family: 'Inter',sans-serif; }
        .inp:focus { border-color: #06b6d4; outline: none; }
        .inp::placeholder { color: rgba(156,163,175,0.5); }
        select.inp option { background: #1e293b; color: white; }
        textarea.inp { resize: vertical; min-height: 100px; }
        .wa-btn { display:inline-flex; align-items:center; gap:0.75rem; padding:0.875rem 2rem; color:white; font-weight:900; border-radius:1rem; text-decoration:none; border:none; cursor:pointer; background:linear-gradient(135deg,#25d366,#128c7e); box-shadow:0 8px 25px rgba(37,211,102,0.3); transition:all 0.2s; }
        .wa-btn:hover { opacity:0.9; transform:translateY(-1px); }
        @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .fi { animation: fadeIn 0.4s ease forwards; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .spinner { width:44px;height:44px;border:3px solid rgba(6,182,212,0.25);border-top-color:#06b6d4;border-radius:50%;animation:spin 0.75s linear infinite; }
        @keyframes fillBar { from{width:0%} to{width:var(--bar-w)} }
        .score-bar-outer { height:7px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:4px; }
        .score-bar-inner { height:100%;border-radius:4px;animation:fillBar 1s ease forwards; }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
        .drawer { animation: slideIn 0.25s ease forwards; }
        /* T10 Studio Light: one calm entrance for the hero, nothing else moves on its own */
        @keyframes t10rise { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
        .t10-rise { animation: t10rise .75s cubic-bezier(.2,.7,.2,1) both; }
        @media (prefers-reduced-motion: reduce) { .t10-rise { animation:none; } }
        .t10 a:focus-visible, .t10 button:focus-visible { outline:3px solid currentColor; outline-offset:3px; }
        /* T2 font */
        .oswald { font-family:'Oswald',sans-serif; }
        /* GD video placeholder */
        .gd-loading { display:flex;align-items:center;justify-content:center;background:#000;color:rgba(255,255,255,0.4);font-size:0.75rem; }
        /* ---- PWA install banner — sits outside React, above every view ---- */
        #pwaInstallBanner{display:none;align-items:center;gap:12px;background:rgba(15,23,42,0.97);border-bottom:1px solid rgba(71,85,105,0.5);padding:10px 16px;position:fixed;top:0;left:0;right:0;z-index:9999;font-family:'Inter',sans-serif;font-size:13px;color:white;backdrop-filter:blur(6px)}
        #pwaInstallBanner.show{display:flex}
        #pwaInstallIcon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#06b6d4,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:14px;color:white}
        #pwaInstallText{flex:1;line-height:1.35}
        #pwaInstallBtn{font-size:12px;font-weight:800;padding:8px 16px;background:linear-gradient(135deg,#06b6d4,#2563eb);color:white;border:none;border-radius:8px;cursor:pointer;white-space:nowrap;flex-shrink:0}
        body.pwa-banner-showing #root{padding-top:48px}

        #vmiUpdateBar{display:none;position:fixed;left:12px;right:12px;bottom:16px;z-index:9999;align-items:center;gap:12px;background:rgba(15,23,42,0.97);border:1px solid rgba(6,182,212,0.4);border-radius:14px;padding:12px 14px;color:white;font-family:'Inter',sans-serif;font-size:13px;font-weight:600}
        #vmiUpdateBar.show{display:flex}
        #vmiUpdateBar span{flex:1}
        #vmiUpdateBar button{font-size:12px;font-weight:800;padding:8px 14px;background:linear-gradient(135deg,#06b6d4,#2563eb);color:white;border:none;border-radius:8px;cursor:pointer}
        #vmiExitToast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(255,255,255,0.97);color:#0f172a;padding:12px 22px;border-radius:30px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.2s, transform 0.2s;}
        #vmiExitToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

<script>
// ---- PWA install (plain JS, deliberately outside the React/Babel bundle) ----
// Lives entirely alongside React rather than inside it — doesn't touch any
// app state, view logic, Supabase calls, or Cloudinary uploads. Works the
// same regardless of which screen (landing, dashboard, admin) is showing.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) document.getElementById('vmiUpdateBar').classList.add('show');
  });
}

const pwaBanner = document.getElementById('pwaInstallBanner');
const pwaInstallBtn = document.getElementById('pwaInstallBtn');
const pwaInstallIcon = document.getElementById('pwaInstallIcon');
const pwaInstallText = document.getElementById('pwaInstallText');
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Only show install banner on the main homepage, not on portfolio pages
  const path = window.location.pathname.replace(/^\/+|\/+$/g,'');
  if(!path || path === 'index.html') {
    pwaBanner.classList.add('show');
    document.body.classList.add('pwa-banner-showing');
  }
});

pwaInstallBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  pwaBanner.classList.remove('show');
  document.body.classList.remove('pwa-banner-showing');
});

window.__vmiInstall = async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    pwaBanner.classList.remove('show');
    document.body.classList.remove('pwa-banner-showing');
  } else if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    alert('VMI Portfolio is already installed on this device. ✅');
  } else {
    alert('To install: open your browser menu (the three dots, or the Share button) and tap "Add to Home screen" or "Install app".');
  }
};

window.addEventListener('appinstalled', () => {
  pwaInstallIcon.textContent = '✓';
  pwaInstallText.textContent = "You're all set — VMI Portfolio is now on your home screen 🎉";
  pwaInstallBtn.remove();
  pwaBanner.classList.add('show');
  document.body.classList.add('pwa-banner-showing');
  setTimeout(() => {
    pwaBanner.classList.remove('show');
    document.body.classList.remove('pwa-banner-showing');
  }, 5500);
});

// ---- Phone back-button handling ----
// Deliberately does NOT reinvent navigation — every target below is exactly
// what each screen's own in-app "Back to Dashboard" button already does
// (see the onBack handlers in the App component). This just gives the
// phone's hardware back button a way to reach that same logic, via the
// __vmiView / __vmiSetView bridge exposed from React above.
const BACK_TARGET = {
  edit: 'dashboard',
  create: 'dashboard',
  templatepicker: 'dashboard',
  login: 'landing',
  admin: 'dashboard',
  reviews: 'dashboard',
  resetpw: 'landing',
  notfound: 'landing',
};

function getBackTarget() {
  const v = window.__vmiView;
  if (v === 'public') {
    // Opened from the dashboard -> back goes there, same as its own onBack.
    // Opened via a direct/shared link (no dashboard to return to) -> treat
    // as top-level, same as landing/dashboard below.
    return window.__vmiFromDashboard ? 'dashboard' : null;
  }
  return BACK_TARGET[v] || null; // null = already top-level (dashboard/landing/loading)
}

const vmiExitToast = document.getElementById('vmiExitToast');
let vmiExitArmed = false;
let vmiExitTimer = null;

function showVmiExitToast() {
  vmiExitToast.classList.remove('show');
  void vmiExitToast.offsetWidth; // force reflow so the fade-in always replays
  vmiExitToast.classList.add('show');
}

history.pushState({ vmiNav: true }, '', location.href);

window.addEventListener('popstate', () => {
  // If the slide-in menu is open, the back button closes it first.
  if (window.__vmiCloseOverlay && window.__vmiCloseOverlay()) {
    history.pushState({ vmiNav: true }, '', location.href);
    return;
  }
  const target = getBackTarget();
  if (target && window.__vmiSetView) {
    // Not at a top-level screen — send the phone's back button through the
    // exact same door the in-app back buttons already use.
    window.__vmiSetView(target);
    window.scrollTo(0, 0);
    history.pushState({ vmiNav: true }, '', location.href); // stay trapped for the next press
    return;
  }

  // Already at a top-level screen (dashboard / landing / a directly-opened
  // shared link).
  if (vmiExitArmed) {
    // Confirmed second press — deliberately do NOT force another step with
    // history.back() here. When there's no earlier page behind this app
    // (the normal case for a fresh tab or installed app), that call is a
    // silent no-op — it has nowhere to go, so nothing visibly happens,
    // which is exactly the "back button does nothing" bug this replaces.
    // Instead: just let this real back-press stand as-is. The browser has
    // already moved one step back on its own; we simply stop re-trapping,
    // so the very next press has nothing left to intercept and the
    // tab/app closes the way it normally would.
    vmiExitToast.classList.remove('show');
    clearTimeout(vmiExitTimer);
    vmiExitArmed = false;
    return;
  }

  vmiExitArmed = true;
  showVmiExitToast();
  history.pushState({ vmiNav: true }, '', location.href);
  vmiExitTimer = setTimeout(() => {
    vmiExitArmed = false;
    vmiExitToast.classList.remove('show');
  }, 2500);
});
</script>
