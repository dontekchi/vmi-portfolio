        #vmiExitToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

<script type="text/babel">

const slugError = s => { if(!s||s.length<3) return 'Link must be at least 3 characters'; if(s.length>30) return 'Link is too long (max 30)'; if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(s)) return 'Use only lowercase letters, numbers and single hyphens'; if(RESERVED_SLUGS.includes(s)) return 'That link is reserved. Try another'; return ''; };

const isYT = u => u&&(u.includes('youtube.com')||u.includes('youtu.be'));

const saveSB = async (p,u) => { const c={...p}; delete c._fromDashboard; try{ const row={id:String(c.id),username:u.email||'',user_id:u.id,data:c}; if(c.slug) row.slug=c.slug; const {error}=await sb.from('portfolios').upsert(row,{onConflict:'id'}); return {error}; }catch(e){ return {error:e}; } };
const fmtTime = s => { const m=Math.floor(s/60); const sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; };

// ── GOOGLE DRIVE NATIVE PLAYER ────────────────────────────────────────────────
function GDPlayer({ url, portrait, template }) {
    const videoRef = useRef(null);
    const hideTimer = useRef(null);
    const iframeRef = useRef(null);
    const [playing, setPlaying] = useState(false);
    const [progress, setProgress] = useState(0);
    const [currentTime, setCurrentTime] = useState(0);
    const [duration, setDuration] = useState(0);
    const [showControls, setShowControls] = useState(true);
    const [ended, setEnded] = useState(false);
    const [error, setError] = useState(false);
    const [loaded, setLoaded] = useState(false);
    const [iframeKey, setIframeKey] = useState(0);

    const directUrl = null;
    const embedUrl = null;
    // Landscape: proper 16:9 aspect ratio using padding trick
    // Portrait: fixed 480px height
    const radius = template==='t3'?'4px':template==='t2'||template==='t4'?'8px':'0.75rem';

    const triggerShow = () => {
        setShowControls(true);
        clearTimeout(hideTimer.current);
        // Landscape — controls stay visible longer (3s), portrait 2s
        hideTimer.current = setTimeout(() => { if(playing) setShowControls(false); }, portrait?2000:3000);
    };

    const togglePlay = e => {
        e && e.stopPropagation();
        const v = videoRef.current; if(!v) return;
        if(v.paused) {
            v.play().then(()=>{ setPlaying(true); setEnded(false); triggerShow(); }).catch(()=>{});
        } else {
            v.pause(); setPlaying(false);
            setShowControls(true); clearTimeout(hideTimer.current);
        }
    };

    const handleTap = e => {
        e && e.preventDefault();
        if(ended) return; // replay button handles this
        if(!showControls) { triggerShow(); return; }
        if(!playing) { togglePlay(e); return; }
        // playing and controls visible — hide controls
        setShowControls(false); clearTimeout(hideTimer.current);
    };

    const replay = e => {
        e && e.stopPropagation();
        const v = videoRef.current; if(!v) return;
        v.currentTime = 0; setProgress(0); setCurrentTime(0);
        setEnded(false); setShowControls(true);
        v.play().then(()=>setPlaying(true)).catch(()=>{});
    };

    const iframeReplay = e => {
        e && e.stopPropagation();
        setIframeKey(k=>k+1); setEnded(false);
    };

    const onTimeUpdate = () => {
        const v = videoRef.current; if(!v) return;
        setCurrentTime(v.currentTime);
        setProgress(v.duration?(v.currentTime/v.duration)*100:0);
    };

    const onLoadedMetadata = () => {
        const v = videoRef.current; if(!v) return;
        setDuration(v.duration); setLoaded(true);
    };

    const onEnded = () => {
        setPlaying(false); setEnded(true);
        setShowControls(false); clearTimeout(hideTimer.current);
    };

    const seekTo = e => {
        e.stopPropagation();
        const v = videoRef.current; if(!v||!v.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clientX = e.touches?.[0]?.clientX ?? e.clientX;
        const pct = Math.max(0, Math.min(1,(clientX-rect.left)/rect.width));
        v.currentTime = pct * v.duration;
        triggerShow();
    };

    useEffect(()=>{ return ()=>clearTimeout(hideTimer.current); },[]);

    // ── IFRAME FALLBACK ──────────────────────────────────────────────────────
    if(error || !directUrl) {
        return (
            <div style={{position:'relative',width:'100%',borderRadius:radius,overflow:'hidden',background:'#000'}}>
                {portrait
                    ? <div style={{height:'480px',position:'relative'}}>
                        <iframe key={iframeKey} src={embedUrl} width="100%" height="480" frameBorder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                            allowFullScreen style={{display:'block',width:'100%',height:'100%',border:'none',filter:'brightness(1.05)'}}/>
                      </div>
                    : <div style={{position:'relative',paddingTop:'56.25%'}}>
                        <iframe key={iframeKey} src={embedUrl} frameBorder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                            allowFullScreen style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',border:'none',filter:'brightness(1.05)'}}/>
                      </div>
                }
                {/* Iframe replay overlay — shown after ~video length or on tap */}
                {ended && (
                    <div onClick={iframeReplay} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.72)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:'pointer',zIndex:10}}>
                        <div style={{width:'60px',height:'60px',borderRadius:'50%',background:'linear-gradient(135deg,#06b6d4,#2563eb)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',marginBottom:'0.75rem',boxShadow:'0 0 30px rgba(6,182,212,0.5)'}}>↺</div>
                        <p style={{color:'white',fontWeight:900,fontSize:'0.875rem'}}>Tap to Replay</p>
                    </div>
                )}
                {/* Manual replay trigger button — small, bottom right */}
                {!ended && (
                    <button onClick={()=>setEnded(true)} style={{position:'absolute',bottom:'8px',right:'8px',background:'rgba(0,0,0,0.5)',border:'none',color:'rgba(255,255,255,0.6)',fontSize:'11px',padding:'3px 8px',borderRadius:'4px',cursor:'pointer',zIndex:10}}>↺</button>
                )}
            </div>
        );
    }

    // ── NATIVE VIDEO PLAYER ──────────────────────────────────────────────────
    return (
        <div style={{position:'relative',width:'100%',borderRadius:radius,overflow:'hidden',background:'#000',userSelect:'none',WebkitUserSelect:'none'}}
            onClick={handleTap} onTouchEnd={e=>{e.preventDefault();handleTap(e);}}>

            {/* VIDEO WRAPPER — proper 16:9 for landscape, fixed for portrait */}
            {portrait
                ? <video ref={videoRef} src={directUrl}
                    style={{display:'block',width:'100%',height:'480px',objectFit:'cover',background:'#000',filter:'brightness(1.05)',WebkitFilter:'brightness(1.05)'}}
                    onTimeUpdate={onTimeUpdate} onLoadedMetadata={onLoadedMetadata} onEnded={onEnded}
                    onError={()=>setError(true)} playsInline preload="metadata"
                    disablePictureInPicture disableRemotePlayback controlsList="nodownload nofullscreen noremoteplayback"/>
                : <div style={{position:'relative',paddingTop:'56.25%',background:'#000'}}>
                    <video ref={videoRef} src={directUrl}
                        style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',objectFit:'cover',background:'#000',filter:'brightness(1.05)',WebkitFilter:'brightness(1.05)'}}
                        onTimeUpdate={onTimeUpdate} onLoadedMetadata={onLoadedMetadata} onEnded={onEnded}
                        onError={()=>setError(true)} playsInline preload="metadata"
                        disablePictureInPicture disableRemotePlayback controlsList="nodownload nofullscreen noremoteplayback"/>
                  </div>
            }

            {/* GRADIENT — bottom fade for controls readability */}
            <div style={{position:'absolute',bottom:0,left:0,right:0,height:'56px',background:'linear-gradient(transparent,rgba(0,0,0,0.8))',pointerEvents:'none',transition:'opacity 0.25s',opacity:showControls&&!ended?1:0}}/>

            {/* CUSTOM CONTROLS — tiny, pinned to bottom, auto-hide */}
            {!ended && (
                <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'0 8px 7px',transition:'opacity 0.25s',opacity:showControls?1:0,pointerEvents:showControls?'all':'none',zIndex:5}}
                    onClick={e=>e.stopPropagation()} onTouchEnd={e=>e.stopPropagation()}>
                    {/* Progress bar — tap/drag to seek */}
                    <div style={{width:'100%',height:'3px',background:'rgba(255,255,255,0.25)',borderRadius:'2px',marginBottom:'6px',cursor:'pointer',touchAction:'none'}}
                        onClick={seekTo} onTouchEnd={seekTo}>
                        <div style={{height:'100%',background:'#06b6d4',borderRadius:'2px',width:progress+'%',transition:'width 0.1s linear',boxShadow:'0 0 4px rgba(6,182,212,0.6)'}}/>
                    </div>
                    {/* Controls row */}
                    <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
                        <button onClick={togglePlay}
                            style={{width:'20px',height:'20px',borderRadius:'50%',background:'rgba(255,255,255,0.18)',border:'none',color:'white',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',flexShrink:0,padding:0}}>
                            {playing?'⏸':'▶'}
                        </button>
                        <span style={{color:'rgba(255,255,255,0.9)',fontSize:'10px',fontWeight:600,fontFamily:'monospace',letterSpacing:'0.3px',flexShrink:0}}>
                            {fmtTime(currentTime)}<span style={{color:'rgba(255,255,255,0.4)'}}> / {fmtTime(duration)}</span>
                        </span>
                    </div>
                </div>
            )}

            {/* CENTER BUTTON — loading / paused / replay */}
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:ended?'all':'none',zIndex:6}}>
                {ended ? (
                    <div onClick={replay} onTouchEnd={e=>{e.preventDefault();replay(e);}}
                        style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',cursor:'pointer',pointerEvents:'all',background:'rgba(0,0,0,0.6)',borderRadius:'1rem',padding:'1rem 1.5rem'}}>
                        <div style={{width:'56px',height:'56px',borderRadius:'50%',background:'linear-gradient(135deg,#06b6d4,#2563eb)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',boxShadow:'0 0 25px rgba(6,182,212,0.5)'}}>↺</div>
                        <p style={{color:'white',fontWeight:900,fontSize:'0.8rem',margin:0}}>Tap to Replay</p>
                    </div>
                ) : !loaded ? (
                    <div style={{width:'48px',height:'48px',borderRadius:'50%',background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.25rem',pointerEvents:'none'}}>⏳</div>
                ) : !playing && showControls ? (
                    <div style={{width:'52px',height:'52px',borderRadius:'50%',background:'rgba(0,0,0,0.55)',border:'1px solid rgba(255,255,255,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.25rem',pointerEvents:'none'}}>▶</div>
                ) : null}
            </div>
        </div>
    );
}

// ── VIDEO GRID ────────────────────────────────────────────────────────────────
function VGrid({ videos, template }) {
    if(!videos||!videos.length) return null;
    const headColor = template==='t2'?'#fb923c':template==='t3'?'#d4af37':template==='t4'?'#93c5fd':'white';
    const headText = (template==='t2'||template==='t3'||template==='t4')?'MY BEST WORK':'🎬 My Best Work';
    const radius = template==='t2'||template==='t4'?'8px':template==='t3'?'4px':'1rem';

// ── SIGN UP / LOG IN / FORGOT PASSWORD ────────────────────────────────────────
function AuthScreen({ initialMode, onDone, onBack }) {
    const [mode, setMode] = useState(initialMode||'signup');
    const [name, setName] = useState('');
    const [email, setEmail] = useState('');
    const [pw, setPw] = useState('');
    const [showPw, setShowPw] = useState(false);
    const [err, setErr] = useState('');
    const [info, setInfo] = useState('');
    const [busy, setBusy] = useState(false);
    useEffect(()=>{ scrollTop(); },[]);
    const nice = m => {
        const s=(m||'').toLowerCase();
        if(s.includes('invalid login')) return 'Wrong email or password.';
        if(s.includes('already registered')||s.includes('already been registered')) return 'That email already has an account. Tap Log In instead.';
        if(s.includes('rate limit')) return 'Too many attempts. Please wait a few minutes and try again.';
        if(s.includes('email not confirmed')) return 'Please confirm your email first, then log in.';
        if(s.includes('network')||s.includes('fetch')) return 'No internet connection. Check your data and try again.';
        return m||'Something went wrong. Try again.';
    };
    const switchMode = m => { setMode(m); setErr(''); setInfo(''); };
    const submit = async () => {
        setErr(''); setInfo('');
        const em=email.trim().toLowerCase();
        if(!/^\S+@\S+\.\S+$/.test(em)){ setErr('Enter a valid email address.'); return; }
        if(mode==='forgot'){
            setBusy(true);
            const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+'/'});
            setBusy(false);
            if(error) setErr(nice(error.message)); else setInfo('Reset link sent. Check your email, and your spam folder too.');
            return;
        }
        if(pw.length<6){ setErr('Password must be at least 6 characters.'); return; }
        if(mode==='signup'){
            if(name.trim().length<2){ setErr('Enter your name.'); return; }
            setBusy(true);
            const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:name.trim()}}});
            setBusy(false);
            if(error){ setErr(nice(error.message)); return; }
            if(data&&data.session) onDone(data.user); else setInfo('Account created. Check your email to confirm it, then log in.');
            return;
        }
        setBusy(true);
        const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
        setBusy(false);
        if(error){ setErr(nice(error.message)); return; }
        onDone(data.user);
    };
    const tab = m => ({flex:1,padding:'0.7rem',fontWeight:900,fontSize:'0.9rem',borderRadius:'0.7rem',border:'none',cursor:'pointer',background:mode===m?'linear-gradient(135deg,#06b6d4,#2563eb)':'transparent',color:mode===m?'white':'#9ca3af'});
    const lbl = {display:'block',color:'white',fontWeight:800,fontSize:'0.8rem',marginBottom:'0.3rem'};
    return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
            <div style={{width:'100%',maxWidth:'400px'}}>
                <button onClick={onBack} style={{color:'#06b6d4',fontSize:'0.875rem',background:'transparent',border:'none',cursor:'pointer',marginBottom:'1rem',fontWeight:700}}>← Back</button>
                <div style={{textAlign:'center',marginBottom:'1.5rem'}}>
                    <img src="/icon-192.png" alt="VMI" style={{width:'64px',height:'64px',borderRadius:'16px',marginBottom:'0.6rem'}}/>
                    <h1 style={{fontSize:'1.6rem',fontWeight:900,...gradText}}>VMI Portfolio</h1>
                    <p style={{color:'#9ca3af',fontSize:'0.85rem'}}>{mode==='forgot'?'Reset your password':'Your professional portfolio starts here'}</p>
                </div>
                <div style={{background:'rgba(15,23,42,0.85)',border:'1px solid rgba(71,85,105,0.35)',borderRadius:'1.25rem',padding:'1.5rem'}}>
                    {mode!=='forgot'&&<div style={{display:'flex',gap:'0.4rem',background:'rgba(51,65,85,0.5)',borderRadius:'0.9rem',padding:'0.25rem',marginBottom:'1.1rem'}}>
                        <button onClick={()=>switchMode('signup')} style={tab('signup')}>Sign Up</button>
                        <button onClick={()=>switchMode('login')} style={tab('login')}>Log In</button>
                    </div>}
                    <div style={{display:'flex',flexDirection:'column',gap:'0.85rem'}}>
                        {mode==='signup'&&<div><label style={lbl}>Full Name</label><input className="inp" type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. ThankGod Nwibe" autoComplete="name"/></div>}
                        <div><label style={lbl}>Email</label><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&mode==='forgot'&&submit()} placeholder="you@email.com" autoComplete="email" autoCapitalize="none"/></div>
                        {mode!=='forgot'&&<div>
                            <label style={lbl}>Password</label>
                            <div style={{position:'relative'}}>
                                <input className="inp" type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="At least 6 characters" autoComplete={mode==='signup'?'new-password':'current-password'} style={{paddingRight:'4rem'}}/>
                                <button onClick={()=>setShowPw(s=>!s)} type="button" style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',background:'transparent',border:'none',color:'#06b6d4',fontWeight:800,fontSize:'0.75rem',cursor:'pointer'}}>{showPw?'Hide':'Show'}</button>
                            </div>
                        </div>}
                    </div>
                    {err&&<p style={{color:'#f87171',fontSize:'0.8rem',marginTop:'0.75rem'}}>⚠️ {err}</p>}
                    {info&&<p style={{color:'#4ade80',fontSize:'0.8rem',marginTop:'0.75rem'}}>✅ {info}</p>}
                    <button onClick={submit} disabled={busy} className="gbtn" style={{width:'100%',padding:'0.9rem',color:'white',fontWeight:900,borderRadius:'0.8rem',fontSize:'1rem',marginTop:'1rem',opacity:busy?0.6:1}}>
                        {busy?'Please wait...':mode==='signup'?'Create My Account →':mode==='login'?'Log In →':'Send Reset Link'}
                    </button>
                    {mode==='login'&&<button onClick={()=>switchMode('forgot')} style={{width:'100%',marginTop:'0.75rem',background:'transparent',border:'none',color:'#9ca3af',fontSize:'0.8rem',cursor:'pointer'}}>Forgot password?</button>}
                    {mode==='forgot'&&<button onClick={()=>switchMode('login')} style={{width:'100%',marginTop:'0.75rem',background:'transparent',border:'none',color:'#9ca3af',fontSize:'0.8rem',cursor:'pointer'}}>← Back to Log In</button>}
                </div>
            </div>
        </div>
    );
}

// ── SET NEW PASSWORD (after reset email) ──────────────────────────────────────
function ResetPassword({ onDone }) {
    const [pw, setPw] = useState('');
    const [err, setErr] = useState('');
    const [busy, setBusy] = useState(false);
    const save = async () => {
        if(pw.length<6){ setErr('Password must be at least 6 characters.'); return; }
        setBusy(true);
        const {data,error}=await sb.auth.updateUser({password:pw});
        setBusy(false);
        if(error){ setErr(error.message||'Could not update password.'); return; }
        try { history.replaceState(null,'','/'); } catch(e){}
        onDone(data.user);
    };
    return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
            <div style={{width:'100%',maxWidth:'400px',background:'rgba(15,23,42,0.85)',border:'1px solid rgba(71,85,105,0.35)',borderRadius:'1.25rem',padding:'1.75rem'}}>
                <h2 style={{color:'white',fontWeight:900,fontSize:'1.3rem',marginBottom:'0.4rem'}}>Set a new password</h2>
                <p style={{color:'#9ca3af',fontSize:'0.82rem',marginBottom:'1rem'}}>Choose a password you will remember.</p>
                <input className="inp" type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&save()} placeholder="New password (6+ characters)" autoComplete="new-password"/>
                {err&&<p style={{color:'#f87171',fontSize:'0.8rem',marginTop:'0.6rem'}}>⚠️ {err}</p>}
                <button onClick={save} disabled={busy} className="gbtn" style={{width:'100%',padding:'0.9rem',color:'white',fontWeight:900,borderRadius:'0.8rem',marginTop:'1rem',opacity:busy?0.6:1}}>{busy?'Saving...':'Save Password'}</button>
            </div>
        </div>
    );
}

function AdminDashboard({ onLogout, onBack }) {

    const [delId, setDelId] = useState(null);
    useEffect(()=>{ scrollTop(); load(); },[]);
    const load = async () => {
        setLoading(true);
        try {
            const {data,error} = await sb.from('portfolios').select('id,username,data,created_at').order('created_at',{ascending:false});
            if(error) { console.error('Supabase error:',error); setLoading(false); return; }
            if(data && data.length > 0){
                const map={};
                data.forEach(r=>{
                    const u = (r.username||'unknown').toLowerCase().trim();
                    if(!map[u]) map[u]={username:u,portfolios:[],views:0,last:r.created_at};
                    map[u].portfolios.push({...r.data,_sbId:r.id});
                    map[u].views += (r.data?.views||0);
                    if(r.created_at > map[u].last) map[u].last = r.created_at;
                });
                const list = Object.values(map).sort((a,b)=>new Date(b.last)-new Date(a.last));
                setUsers(list);
                setStats({
                    users: list.length,
                    portfolios: data.length,
                    views: data.reduce((s,r)=>s+(r.data?.views||0),0),
                    today: data.filter(r=>new Date(r.created_at).toDateString()===new Date().toDateString()).length
                });
            } else {
                setUsers([]);
                setStats({users:0,portfolios:0,views:0,today:0});
            }

        setLoading(false);

                                                                    <button onClick={()=>setDelId(pf.id)} style={{fontSize:'0.7rem',padding:'2px 8px',borderRadius:'0.4rem',border:'1px solid rgba(239,68,68,0.5)',color:'#f87171',background:'transparent',cursor:'pointer'}}>Delete</button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        {adminWALink&&<a href={adminWALink} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:'0.4rem',fontSize:'0.75rem',padding:'5px 12px',borderRadius:'0.5rem',background:'rgba(37,211,102,0.1)',border:'1px solid rgba(37,211,102,0.3)',color:'#4ade80',textDecoration:'none',fontWeight:700}}>💬 Message on WhatsApp</a>}
                                                    </div>
                                                    <div style={{textAlign:'right',flexShrink:0}}>
                                                        <div style={{color:'#6b7280',fontSize:'0.75rem',marginBottom:'4px'}}>Avg Score</div>
                                                        <div style={{color:scCol(avg),fontSize:'1.5rem',fontWeight:900}}>{avg}%</div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

        onSubmit({slug:hasSlug?portfolio.slug:slug,studentName:name,whatsapp:wa,skillType:skill,photo,headline,subtitle,about,services,whyChoose,cta,videos,...(template?{template}:{})});

                        <div style={{display:'flex',alignItems:'center',background:'rgba(51,65,85,0.8)',border:'1px solid rgba(71,85,105,0.6)',borderRadius:'0.75rem',overflow:'hidden'}}>

                    <div><label style={{display:'block',color:'white',fontWeight:900,fontSize:'0.875rem',marginBottom:'2px'}}>Power Headline *</label><p style={{color:'#6b7280',fontSize:'0.72rem',marginBottom:'0.35rem'}}>Bold and emotional — the first thing clients read</p><input className="inp" ref={headlineRef} type="text" defaultValue={portfolio?.headline||''} placeholder="e.g. I Turn Raw Footage Into Content That Stops the Scroll" maxLength={100}/></div>

                    <div><label style={{display:'block',color:'white',fontWeight:900,fontSize:'0.875rem',marginBottom:'2px'}}>{isEdit?'Update Photo (optional)':'Your Photo'}</label><p style={{color:'#6b7280',fontSize:'0.72rem',marginBottom:'0.35rem'}}>A great photo builds trust instantly</p><input className="inp" type="file" accept="image/*" onChange={handlePhoto} disabled={uploading} style={{padding:'0.5rem'}}/>{uploading&&<p style={{color:'#06b6d4',fontSize:'0.875rem',marginTop:'8px'}}>📤 Uploading photo...</p>}{photo&&!uploading&&<img src={photo} alt="Preview" style={{marginTop:'12px',width:'6rem',height:'6rem',borderRadius:'50%',objectFit:'cover',border:'4px solid rgba(6,182,212,0.5)'}}/>}</div>

// ── MAIN APP ──────────────────────────────────────────────────────────────────
const getSlugFromPath = () => {
    const p = window.location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
    if(!p || p==='index.html' || p.includes('.') || p.includes('/')) return '';
    return p;
};

function Modal({ children }) {
    return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',zIndex:120,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>{children}</div>;
}

function App() {
    const [view, setView] = useState('loading');
    const [user, setUser] = useState(null);
    const [portfolios, setPortfolios] = useState([]);
    const [curPortfolio, setCurPortfolio] = useState(null);
    const [popup, setPopup] = useState(false);
    const [sharingId, setSharingId] = useState(null);
    const [loadingP, setLoadingP] = useState(false);
    const [delTarget, setDelTarget] = useState(null);
    const [successMsg, setSuccessMsg] = useState('');
    const [pending, setPending] = useState(null);
    const [changingTemplate, setChangingTemplate] = useState(false);
    const [menuOpen, setMenuOpen] = useState(false);
    const [authMode, setAuthMode] = useState('signup');
    const [claimOpen, setClaimOpen] = useState(false);
    const [claimName, setClaimName] = useState('');
    const [claimMsg, setClaimMsg] = useState('');
    const [claimBusy, setClaimBusy] = useState(false);
    const [justCreated, setJustCreated] = useState(false);

    const isAdmin = !!(user && ADMIN_EMAILS.includes((user.email||'').toLowerCase()));
    const displayName = user ? ((user.user_metadata&&user.user_metadata.name) || (user.email||'').split('@')[0]) : '';

    // Bridge so the phone's back button (plain script below) can reach the same navigation.
    useEffect(() => {
        window.__vmiView = view;
        window.__vmiFromDashboard = !!(curPortfolio && curPortfolio._fromDashboard);
        window.__vmiSetView = setView;
        window.__vmiMenuOpen = menuOpen;
        window.__vmiCloseMenu = () => setMenuOpen(false);
        if (window.__vmiNavChanged) window.__vmiNavChanged();
    }, [view, curPortfolio, menuOpen]);

    const loadPortfolios = async u => {
        const {data,error} = await sb.from('portfolios').select('data').eq('user_id',u.id).order('created_at',{ascending:false});
        if(data&&!error) setPortfolios(data.map(r=>r.data)); else setPortfolios(getLocal(u.id));
    };

    const enterDashboard = async u => {
        setUser(u); setLoadingP(true); setView('dashboard'); scrollTop();
        await loadPortfolios(u);
        setLoadingP(false);
    };

    useEffect(()=>{
        const params = new URLSearchParams(window.location.search);
        const sid = params.get('id');
        const enc = params.get('p');
        const slug = getSlugFromPath();
        const isRecovery = window.location.hash.includes('type=recovery');

        const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
            if(event==='SIGNED_OUT') setUser(null);
            else if(session&&session.user) setUser(session.user);
        });

        const showPublic = d => { setCurPortfolio(d); setView('public'); };
        const fromEnc = () => { if(enc){ try{ const d=JSON.parse(decodeURIComponent(escape(atob(enc)))); showPublic(d); return true; }catch(e){} } return false; };

        (async () => {
            if(isRecovery){ setView('resetpw'); return; }
            if(slug){
                const {data,error} = await sb.from('portfolios').select('data').eq('slug',slug).limit(1);
                if(data&&data.length&&!error) showPublic(data[0].data); else setView('notfound');
                return;
            }
            if(sid){
                const {data,error} = await sb.from('portfolios').select('data').eq('id',sid).limit(1);
                if(data&&data.length&&!error) showPublic(data[0].data); else if(!fromEnc()) setView('landing');
                return;
            }
            if(fromEnc()) return;
            try { localStorage.removeItem('vmiUsername'); } catch(e){}
            const {data:{session}} = await sb.auth.getSession();
            if(session&&session.user) enterDashboard(session.user); else setView('landing');
        })();
        return () => { try{ sub.subscription.unsubscribe(); }catch(e){} };
    },[]);

    const go = v => { setMenuOpen(false); setView(v); scrollTop(); };
    const scrollToId = id => { setMenuOpen(false); setTimeout(()=>{ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); };

    const createPortfolio = fd => { const newP={...fd,id:Date.now(),createdAt:new Date().toISOString()}; setPending(newP); setChangingTemplate(false); setView('templatepicker'); scrollTop(); };

    const finishCreate = async template => {
        const newP = {...pending,template};
        const wasChange = changingTemplate;
        const base = wasChange ? portfolios.map(p=>p.id===newP.id?newP:p) : [newP,...portfolios];
        setPortfolios(base); saveLocal(user.id,base);
        let saved = newP;
        let res = await saveSB(saved,user);
        if(res.error && res.error.code==='23505'){
            saved = {...newP,slug:''};
            setPortfolios(l=>l.map(p=>p.id===saved.id?saved:p));
            res = await saveSB(saved,user);
            alert('That link was just taken by someone else. Your portfolio was saved without a custom link. Tap Edit to choose another.');
        }
        if(res.error) alert('Saved on this device, but could not sync to the cloud: '+(res.error.message||'unknown error')+'\nCheck your internet, then tap Edit and Save to try again.');
        else { setSuccessMsg(wasChange?'✅ Template updated!':'🎉 Portfolio created!'); setTimeout(()=>setSuccessMsg(''),3000); }
        setPending(null); setChangingTemplate(false);
        setJustCreated(!wasChange);
        setCurPortfolio({...saved,_fromDashboard:true}); setView('public'); scrollTop();
    };

    const updatePortfolio = async fd => {
        let updated = {...curPortfolio,...fd,template:curPortfolio.template||'t1'}; delete updated._fromDashboard;
        const newList = portfolios.map(p=>p.id===curPortfolio.id?updated:p);
        setPortfolios(newList); saveLocal(user.id,newList);
        let res = await saveSB(updated,user);
        if(res.error && res.error.code==='23505'){
            updated = {...updated,slug:''};
            setPortfolios(l=>l.map(p=>p.id===updated.id?updated:p));
            res = await saveSB(updated,user);
            alert('That link was just taken. Your changes were saved without a custom link. Tap Edit to choose another.');
        }
        if(res.error) alert('Saved on this device, but could not sync to the cloud: '+(res.error.message||'unknown error'));
        setCurPortfolio({...updated,_fromDashboard:true}); setView('public'); scrollTop();
    };

    const deletePortfolio = async id => {
        const {error} = await sb.from('portfolios').delete().eq('id',String(id));
        if(error){ alert('Could not delete: '+error.message); setDelTarget(null); return; }
        const newList = portfolios.filter(p=>p.id!==id);
        setPortfolios(newList); saveLocal(user.id,newList);
        setDelTarget(null);
    };

    const sharePortfolio = async pf => {
        const clean = {...pf}; delete clean._fromDashboard;
        const url = portfolioUrl(clean);
        const text = 'Check out my video portfolio 👇';
        setSharingId(pf.id);
        try {
            if(navigator.share) await navigator.share({title:(clean.studentName||'My')+' | Video Portfolio',text,url});
            else { await copyText(url); setPopup(true); }
        } catch(e) {
            if(!(e&&e.name==='AbortError')){ await copyText(url); setPopup(true); }
        }
        setSharingId(null);
    };

    const openChangeTemplate = pf => { setPending(pf); setChangingTemplate(true); setView('templatepicker'); scrollTop(); };

    const logout = async () => {
        setMenuOpen(false);
        try { await sb.auth.signOut(); } catch(e){}
        setUser(null); setPortfolios([]); setCurPortfolio(null); setView('landing'); scrollTop();
    };

    const claim = async () => {
        const n = claimName.trim();
        if(n.length<2){ setClaimMsg('⚠️ Enter your old username.'); return; }
        setClaimBusy(true); setClaimMsg('');
        const {data,error} = await sb.rpc('claim_username',{uname:n});
        setClaimBusy(false);
        if(error){ setClaimMsg('⚠️ '+(error.message||'Could not claim.')); return; }
        if(!data){ setClaimMsg('⚠️ No unclaimed portfolios found for that username.'); return; }
        setClaimMsg('✅ '+data+' portfolio'+(data!==1?'s':'')+' added to your account.');
        await loadPortfolios(user);
        setTimeout(()=>{ setClaimOpen(false); setClaimMsg(''); setClaimName(''); },1800);
    };

    // ── MENUS ──
    const installApp = () => { setMenuOpen(false); if(window.__vmiInstall) window.__vmiInstall(); };
    const landingMenu = [
        {icon:'🎬',label:'How It Works',onClick:()=>scrollToId('how')},
        {icon:'🎨',label:'Templates',onClick:()=>scrollToId('templates')},
        {icon:'❓',label:'FAQ',onClick:()=>scrollToId('faq')},
        {divider:true},
        {icon:'🚀',label:'Get Started',onClick:()=>{setAuthMode('signup');go('login');}},
        {icon:'🔑',label:'Log In',onClick:()=>{setAuthMode('login');go('login');}},
        {icon:'📲',label:'Install App',onClick:installApp},
    ];
    const dashMenu = [
        {icon:'🏠',label:'My Portfolios',onClick:()=>go('dashboard')},
        {icon:'➕',label:'Create New',onClick:()=>go('create')},
        {icon:'🔁',label:'Bring In Old Portfolios',onClick:()=>{setMenuOpen(false);setClaimOpen(true);}},
        {divider:true},
        {icon:'📲',label:'Install App',onClick:installApp},

                                            <button onClick={()=>sharePortfolio(pf)} disabled={sharingId===pf.id} style={{padding:'0.625rem',background:'#16a34a',color:'white',fontWeight:900,fontSize:'0.875rem',borderRadius:'0.75rem',border:'none',cursor:'pointer',opacity:sharingId===pf.id?0.6:1}}>{sharingId===pf.id?'⏳ ...':'📤 Share'}</button>

<script>
// ---- PWA install (plain JS, deliberately outside the React/Babel bundle) ----
// Lives entirely alongside React rather than inside it — doesn't touch any
// app state, view logic, Supabase calls, or Cloudinary uploads. Works the
// same regardless of which screen (landing, dashboard, admin) is showing.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) document.getElementById('vmiUpdateBar').classList.add('show');
  });
}

const pwaBanner = document.getElementById('pwaInstallBanner');
const pwaInstallBtn = document.getElementById('pwaInstallBtn');
const pwaInstallIcon = document.getElementById('pwaInstallIcon');
const pwaInstallText = document.getElementById('pwaInstallText');
let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Only show install banner on the main homepage, not on portfolio pages
  const path = window.location.pathname.replace(/^\/+|\/+$/g,'');
  if(!path || path === 'index.html') {
    pwaBanner.classList.add('show');
    document.body.classList.add('pwa-banner-showing');
  }
});

pwaInstallBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  pwaBanner.classList.remove('show');
  document.body.classList.remove('pwa-banner-showing');
});

window.__vmiInstall = async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    pwaBanner.classList.remove('show');
    document.body.classList.remove('pwa-banner-showing');
  } else if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    alert('VMI Portfolio is already installed on this device. ✅');
  } else {
    alert('To install: open your browser menu (the three dots, or the Share button) and tap "Add to Home screen" or "Install app".');
  }
};

window.addEventListener('appinstalled', () => {
  pwaInstallIcon.textContent = '✓';
  pwaInstallText.textContent = "You're all set — VMI Portfolio is now on your home screen 🎉";
  pwaInstallBtn.remove();
  pwaBanner.classList.add('show');
  document.body.classList.add('pwa-banner-showing');
  setTimeout(() => {
    pwaBanner.classList.remove('show');
    document.body.classList.remove('pwa-banner-showing');
  }, 5500);
});

// ---- Phone back-button handling ----
// Deliberately does NOT reinvent navigation — every target below is exactly
// what each screen's own in-app "Back to Dashboard" button already does
// (see the onBack handlers in the App component). This just gives the
// phone's hardware back button a way to reach that same logic, via the
// __vmiView / __vmiSetView bridge exposed from React above.
const BACK_TARGET = {
  edit: 'dashboard',
  create: 'dashboard',
  templatepicker: 'dashboard',
  login: 'landing',
  admin: 'dashboard',
  resetpw: 'landing',
  notfound: 'landing',
};

function getBackTarget() {
  const v = window.__vmiView;
  if (v === 'public') {
    // Opened from the dashboard -> back goes there, same as its own onBack.
    // Opened via a direct/shared link (no dashboard to return to) -> treat
    // as top-level, same as landing/dashboard below.
    return window.__vmiFromDashboard ? 'dashboard' : null;
  }
  return BACK_TARGET[v] || null; // null = already top-level (dashboard/landing/loading)
}

const vmiExitToast = document.getElementById('vmiExitToast');
let vmiExitArmed = false;
let vmiExitTimer = null;

function showVmiExitToast() {
  vmiExitToast.classList.remove('show');
  void vmiExitToast.offsetWidth; // force reflow so the fade-in always replays
  vmiExitToast.classList.add('show');
}

history.pushState({ vmiNav: true }, '', location.href);

window.addEventListener('popstate', () => {
  // If the slide-in menu is open, the back button closes it first.
  if (window.__vmiMenuOpen && window.__vmiCloseMenu) {
    window.__vmiCloseMenu();
    history.pushState({ vmiNav: true }, '', location.href);
    return;
  }
  const target = getBackTarget();
  if (target && window.__vmiSetView) {
    // Not at a top-level screen — send the phone's back button through the
    // exact same door the in-app back buttons already use.
    window.__vmiSetView(target);
    window.scrollTo(0, 0);
    history.pushState({ vmiNav: true }, '', location.href); // stay trapped for the next press
    return;
  }

  // Already at a top-level screen (dashboard / landing / a directly-opened
  // shared link).
  if (vmiExitArmed) {
    // Confirmed second press — deliberately do NOT force another step with
    // history.back() here. When there's no earlier page behind this app
    // (the normal case for a fresh tab or installed app), that call is a
    // silent no-op — it has nowhere to go, so nothing visibly happens,
    // which is exactly the "back button does nothing" bug this replaces.
    // Instead: just let this real back-press stand as-is. The browser has
    // already moved one step back on its own; we simply stop re-trapping,
    // so the very next press has nothing left to intercept and the
    // tab/app closes the way it normally would.
    vmiExitToast.classList.remove('show');
    clearTimeout(vmiExitTimer);
    vmiExitArmed = false;
    return;
  }

  vmiExitArmed = true;
  showVmiExitToast();
  history.pushState({ vmiNav: true }, '', location.href);
  vmiExitTimer = setTimeout(() => {
    vmiExitArmed = false;
    vmiExitToast.classList.remove('show');
  }, 2500);
});
</script>
